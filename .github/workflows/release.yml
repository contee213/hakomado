# v0.1.0 のようなタグをプッシュすると、リリース版のビルド (node tools/build.js。extension/ から ⏱ アーカイブ同期 (実験的な機能) の
# コードを抜いたもの → dist/hakomado/。HAKO-51) を ZIP にして GitHub のリリースを作る。
# タグと manifest.json の version が違うときは止める (付け間違いで違う版を配らないように)。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # テストが通らない版は配らない
      - name: Test
        run: npm test

      - name: Check the version
        run: |
          VER=$(node -p "require('./extension/manifest.json').version")
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ ($GITHUB_REF_NAME) と manifest.json の version ($VER) が違います"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      # 同期のコードを抜いた写しを作る (抜いたファイルがどこからも読まれていないかも、ここで確かめる)
      - name: Build (without the archive sync)
        run: node tools/build.js

      # Chrome ウェブストアに上げる用の ZIP は "key" を入れる前に作る (ストアは "key" 入りのパッケージを受け付けず、自分の鍵で ID を決める)。
      # 開発者モードで読み込む人向けではないので、ファイル名で分ける (CHROMEWEBSTORE.md の「ストアに上げる手順」)
      - name: Make the zip for the Chrome Web Store
        run: |
          cd dist/hakomado
          zip -r -X "../../hakomado-$VER-chrome-web-store.zip" . -x '.*'
          cd ../..
          if unzip -p "hakomado-$VER-chrome-web-store.zip" manifest.json | grep -q '"key"'; then
            echo "::error::ストア用の ZIP の manifest.json に key が入っています"
            exit 1
          fi
          if unzip -l "hakomado-$VER-chrome-web-store.zip" | grep -qE ' (sync|sync-groups|audio-align|audio-align-worker|waves|wave-strip)\.js$'; then
            echo "::error::ストア用の ZIP にアーカイブ同期のファイルが入っています"
            exit 1
          fi

      # ZIP の manifest.json にだけ "key" を入れて、拡張機能の ID を固定する (展開する場所を変えても同じ拡張機能のまま)。
      # リポジトリの extension/ には入れず、dist/hakomado/ の写しにだけ入れる (開発用フォルダと配布版を同じプロファイルに並べて入れられるように)
      - name: Fix the extension ID
        run: node tools/release-key.js inject dist/hakomado/manifest.json

      # ZIP の直下に manifest.json が来るようにする (展開したフォルダをそのまま読み込めるように)
      - name: Make the zip
        run: |
          cd dist/hakomado
          zip -r -X "../../hakomado-$VER.zip" . -x '.*'
          cd ../..
          unzip -l "hakomado-$VER.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "hakomado-$VER.zip" "hakomado-$VER-chrome-web-store.zip" \
            --title "Hakomado $VER" \
            --notes "インストールには \`hakomado-$VER.zip\` を使ってください (\`-chrome-web-store.zip\` は Chrome ウェブストアに上げる用で、拡張機能の ID が固定されていません)。" \
            --generate-notes
