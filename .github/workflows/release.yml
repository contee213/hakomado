# v0.1.0 のようなタグをプッシュすると、extension フォルダの中身を ZIP にして GitHub のリリースを作る。
# タグと manifest.json の version が違うときは止める (付け間違いで違う版を配らないように)。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # テストが通らない版は配らない
      - name: Test
        run: npm test

      - name: Check the version
        run: |
          VER=$(node -p "require('./extension/manifest.json').version")
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ ($GITHUB_REF_NAME) と manifest.json の version ($VER) が違います"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      # ZIP の manifest.json にだけ "key" を入れて、拡張機能の ID を固定する (展開する場所を変えても同じ拡張機能のまま)。
      # リポジトリの extension/ には入れない (開発用フォルダと配布版を同じプロファイルに並べて入れられるように)
      - name: Fix the extension ID
        run: node tools/release-key.js inject extension/manifest.json

      # ZIP の直下に manifest.json が来るようにする (展開したフォルダをそのまま読み込めるように)
      - name: Make the zip
        run: |
          cd extension
          zip -r -X "../hakomado-$VER.zip" . -x '.*'
          cd ..
          unzip -l "hakomado-$VER.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "hakomado-$VER.zip" \
            --title "Hakomado $VER" \
            --generate-notes
