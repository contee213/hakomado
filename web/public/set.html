<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakomado セット集</title>
  <meta name="description" content="">
  <meta property="og:title" content="Hakomado セット集">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta property="og:url" content="">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/js/ext/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/js/ext/icon.svg" alt="" width="28" height="28">Hakomado <span data-i18n="brandSub">セット集</span></a>
    <a class="btn primary" href="/post" data-i18n="navPost">＋ 投稿</a>
  </header>
  <main class="wrap narrow">
    <p id="status" class="status" data-i18n="loading">読み込み中…</p>
    <article id="set" hidden>
      <div id="preview" class="preview"></div>
      <h1 id="name"></h1>
      <p id="meta" class="meta"></p>
      <p id="tags" class="tags" hidden></p>
      <p id="unlisted" class="notice" hidden data-i18n="unlistedNote">このセットは一覧・検索に載っていません。リンクを知っている人だけが見られます。</p>
      <p id="dead" class="notice warn" hidden></p>
      <div class="actions">
        <a id="open" class="btn primary big" target="_blank" rel="noopener" data-i18n="openBtn">▶ Hakomado で開く</a>
        <button type="button" id="copyCode" class="btn" data-i18n="copyCode">コードをコピー</button>
        <button type="button" id="copyPage" class="btn" data-i18n="copyPage">ページの URL をコピー</button>
      </div>
      <p class="hint"><span data-i18n="openHint">Hakomado (Chrome 拡張機能) を入れていると、マルチビュー画面で同じ並びのまま開きます。入れていなければ YouTube の再生リストとして開きます。</span>
        <a href="https://github.com/contee213/hakomado#インストール" data-i18n="getHakomado">Hakomado を入れる</a></p>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
      <h2 data-i18n="videosH">動画</h2>
      <ol id="videos" class="videos"></ol>
      <details class="manage">
        <summary data-i18n="manageH">削除・通報</summary>
        <div id="ownDelete" hidden>
          <p data-i18n="ownNote">このブラウザから投稿したセットです。</p>
          <button type="button" id="deleteOwn" class="btn danger" data-i18n="deleteOwn">このセットを削除</button>
        </div>
        <form id="keyDelete" class="row">
          <label for="deleteKey" data-i18n="deleteKeyLabel">削除用の合言葉</label>
          <input id="deleteKey" autocomplete="off" maxlength="64" required>
          <button class="btn danger" data-i18n="deleteBtn">削除</button>
        </form>
        <p>
          <button type="button" id="report" class="btn" data-i18n="reportBtn">問題のある投稿として通報</button>
        </p>
      </details>
    </article>
  </main>
  <footer class="foot">
    <a href="https://github.com/contee213/hakomado" data-i18n="footExt">Hakomado (Chrome 拡張機能)</a><span data-i18n="footNote"> · 個人が作った非公式のツールです</span>
    <button type="button" id="langToggle" class="link" data-feature="en" data-i18n="langToggle">English</button>
  </footer>
  <script src="/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ext/layouts-generated.js"></script>
  <script src="/js/ext/layouts.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/set.js"></script>
</body>
</html>
