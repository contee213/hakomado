<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="titlePost">投稿 | Hakomado セット集</title>
  <meta name="description" content="Hakomado で共有した視聴セットを投稿する">
  <link rel="icon" href="/js/ext/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/js/ext/icon.svg" alt="" width="28" height="28">Hakomado <span data-i18n="brandSub">セット集</span></a>
  </header>
  <main class="wrap narrow">
    <h1 data-i18n="postH">セットを投稿</h1>
    <p class="lead" data-i18n="leadPost">Hakomado の「🔗 共有」で作ったコード (#Hakomado …) かリンクを貼るか、共有画像を選んでください。</p>
    <form id="form">
      <label for="text" data-i18n="codeLabel">コード・リンク</label>
      <textarea id="text" rows="4" maxlength="2000" placeholder="#Hakomado u2x2.xxxxxxxxxxxyyyyyyyyyyy &quot;名前&quot;" required></textarea>
      <div id="drop" class="drop">
        <span data-i18n="dropText">共有画像をここにドロップ、または</span>
        <label class="btn small"><span data-i18n="chooseImage">画像を選ぶ</span><input type="file" id="image" accept="image/*" hidden></label>
      </div>
      <p id="parseMsg" class="msg" aria-live="polite"></p>
      <div id="preview" class="preview small" hidden></div>

      <label for="author" data-i18n="authorLabel">投稿者の名前 (任意・30 文字まで)</label>
      <input id="author" maxlength="30" autocomplete="nickname">

      <div data-feature="tags">
        <label for="tagsIn" data-i18n="tagsInputLabel">タグ (任意・空白で区切って 5 個まで)</label>
        <input id="tagsIn" maxlength="120" autocomplete="off" data-i18n-placeholder="tagsPlaceholder" placeholder="例: 歌枠 コラボ">
      </div>
      <label class="check" data-feature="unlisted"><input type="checkbox" id="unlisted"> <span data-i18n="unlistedLabel">リンクを知っている人だけに見せる (一覧・検索に載せない)</span></label>

      <div id="turnstile"></div>
      <p class="hint" data-i18n="postHint">投稿したセット (動画・レイアウト・名前・投稿者の名前など) は、誰でも見られるページになります。</p>
      <button id="submit" class="btn primary big" disabled data-i18n="submit">投稿する</button>
      <p id="postMsg" class="msg" aria-live="polite"></p>
    </form>

    <section id="done" hidden>
      <h2 data-i18n="doneH">投稿しました</h2>
      <p><a id="doneLink" class="btn primary" data-i18n="doneLink">セットのページを見る</a></p>
      <p data-i18n="doneKeyNote">削除用の合言葉 (このブラウザにも保存しました。ほかの端末から消すときに使います):</p>
      <p class="row"><input id="doneKey" readonly><button type="button" id="copyKey" class="btn" data-i18n="copyKey">コピー</button></p>
    </section>
  </main>
  <footer class="foot">
    <a href="https://github.com/contee213/hakomado" data-i18n="footExt">Hakomado (Chrome 拡張機能)</a><span data-i18n="footNote"> · 個人が作った非公式のツールです</span>
    <button type="button" id="langToggle" class="link" data-feature="en" data-i18n="langToggle">English</button>
  </footer>
  <script src="/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ext/layouts-generated.js"></script>
  <script src="/js/ext/layouts.js"></script>
  <script src="/js/ext/share-code.js"></script>
  <script src="/js/ext/jsQR.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
